# Reproducible-build pins for Torizon OS release builds (study layer, not upstreamed)
# prepended so the cyclonedx-export.bbclass overlay is found before meta-cyclonedx
BBPATH =. "${LAYERDIR}:"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "meta-repro"
BBFILE_PATTERN_meta-repro = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-repro = "99"
LAYERSERIES_COMPAT_meta-repro = "wrynose"
LAYERDEPENDS_meta-repro = "core"
# NXP-specific appends, only when meta-freescale is in the build (Arm i.MX machines)
BBFILES_DYNAMIC += "freescale-layer:${LAYERDIR}/dynamic-layers/freescale-layer/*/*/*.bbappend"
