# Reproducible release settings. Use with: require conf/repro-release.conf
# Release identity: no date in DISTRO_VERSION / image names
TDX_PURPOSE = "Release"
# Fixed build date/time from the release tag (/etc/timestamp, /etc/version, buildinfo).
# Pin DATETIME itself: bitbake resets DATE/TIME at every build start (cooker buildSetVars).
DATETIME = "20261124000000"
# keep per-run cooker logs unique (BB_CONSOLELOG defaults to ${DATETIME}.log)
BB_CONSOLELOG = "${LOG_DIR}/cooker/${MACHINE}/${DATE}${TIME}.log"
# Image filesystem pins (ext4 UUID + hash seed + times, ostree sysroot mtimes, NSS .chk)
IMAGE_CLASSES += "repro-image"
# wic: fixed GPT partition UUIDs and ESP volume ID
WKS_FILE:intel-corei7-64:sota = "efiimage-sota-repro.wks"
# Fixed rootfs size (KB): the default is du(staged rootfs) x overhead, and du depends on the
# host filesystem's directory sizes. Pick a rounded value above the computed size per release.
IMAGE_ROOTFS_SIZE:intel-corei7-64 = "6600000"
# SOURCE_DATE_EPOCH: keep the SDE file through rm_work, fail instead of a silent 2011 fallback
INHERIT += "repro-sde-guard"
# Release images: no VirtualBox/VMware disk images. qemu-img writes random disk UUIDs / CIDs
# into .vdi/.vmdk, so they cannot be reproduced; users convert the reproducible .wic instead.
IMAGE_FSTYPES:remove = "wic.vmdk wic.vdi"
